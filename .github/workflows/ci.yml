name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CONTENT_SOURCE: json
      # Prisma generate in postinstall needs a placeholder URL when no DB is wired.
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate content
        run: npm run content:validate

      - name: Build
        run: npm run build
